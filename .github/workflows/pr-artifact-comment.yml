name: PR artifact comment

on:
  workflow_run:
    workflows:
      - CI/CD
    types:
      - completed

permissions:
  actions: read
  issues: write
  pull-requests: read

jobs:
  comment:
    name: Publish installer link on PR
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Create or update comment
        uses: actions/github-script@v8
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = Number(process.env.RUN_ID);
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const marker = '<!-- myframe-pr-artifact -->';

            let pullRequest = context.payload.workflow_run.pull_requests?.[0];

            if (!pullRequest) {
              const { data: associatedPullRequests } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: headSha,
                });

              pullRequest = associatedPullRequests.find(candidate =>
                candidate.state === 'open' &&
                candidate.base.repo.full_name === `${owner}/${repo}`
              );
            }

            if (!pullRequest) {
              core.warning(`No open pull request was found for ${headSha}.`);
              return;
            }

            const pullNumber = Number(pullRequest.number);
            const artifactName = `MyFrame-pr-${pullNumber}-win-x64`;
            const { data: artifactResponse } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });

            const artifact = artifactResponse.artifacts.find(candidate =>
              candidate.name === artifactName && !candidate.expired
            );

            if (!artifact) {
              core.setFailed(`Artifact ${artifactName} was not found.`);
              return;
            }

            const artifactUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}` +
              `/actions/runs/${runId}/artifacts/${artifact.id}`;
            const shortSha = headSha.slice(0, 7);
            const body = [
              marker,
              '### Windows preview',
              '',
              `✅ Tests passed and a self-contained build was generated for \`${shortSha}\`.`,
              '',
              `**[Download installer and portable build](${artifactUrl})**`,
              '',
              `The download contains \`MyFrame-win-Setup.exe\` and \`MyFrame-win-Portable.zip\`; the .NET SDK is not required.`,
              '',
              '> ⚠️ This unsigned preview was built from the code in this PR. Run only changes you trust.',
              '',
              `> GitHub sign-in is required. The artifact is retained for 30 days. [View workflow run](${runUrl}).`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100,
              }
            );
            const existingComment = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }
